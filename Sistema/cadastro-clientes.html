<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos para botões do formulário de cliente */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: .75rem;
            margin-top: 1rem;
            align-items: center;
        }

        .btn-save-custom {
            padding: .55rem 1.25rem;
            border-radius: .5rem;
            box-shadow: 0 6px 18px rgba(40,167,69,0.12);
            font-weight: 600;
        }

        .btn-cancel-custom {
            padding: .5rem 1.1rem;
            border-radius: .5rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3>Cadastro de Cliente</h3>
    <hr>

    <form class="card shadow p-4">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" placeholder="Nome do cliente">
        </div>

        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control" placeholder="(00) 00000-0000">
        </div>

        <div class="mb-3">
            <label class="form-label">Endereço</label>
            <input type="text" class="form-control" placeholder="Rua, número, bairro...">
        </div>

        <div class="form-actions">
            <a href="clientes-lista.html" class="btn btn-outline-secondary btn-cancel-custom">Cancelar</a>
            <button type="submit" class="btn btn-success btn-save-custom">Salvar</button>
        </div>
    </form>
</div>

</body>
</html>
