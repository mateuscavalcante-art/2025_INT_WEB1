<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* impede scroll na página */
        }

        /* container ocupa a tela inteira e centraliza o conteúdo */
        .welcome-container {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Permite que os itens fiquem em coluna (título e botões) */
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding-top: 56px; /* Ajuste para não ficar atrás da navbar */
        }

        /* imagem como background full-screen atrás do conteúdo */
        .welcome-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* overlay para melhorar contraste do texto sobre a imagem */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
        }

        .welcome-title {
            font-size: 2.5rem;
            font-weight: 600;
            /* remove transform: translateY(-30px) para usar margin-bottom */
            margin-bottom: 20px; 
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            z-index: 1;
        }

        /* Container dos botões - CENTRALIZADO E COM MARGEM */
        .options-container {
            display: flex;
            gap: 20px; /* Espaço entre os botões */
            margin-top: 10px; /* Pequena margem abaixo do Seja bem-vindo! */
            z-index: 1; /* Garante que fique acima da imagem de fundo */
        }

        /* Estilo dos botões para combinar com o fundo */
        .option-link {
            font-size: 1.05rem;
            font-weight: 600;
            padding: 10px 24px;
            /* transparente sobre a imagem; leve brilho branco para legibilidade */
            background-color: rgba(255,255,255,0.06);
            color: #ffffff; /* branco para contraste sobre o azul/imag */
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: none;
            backdrop-filter: blur(4px);
            transition: background-color 0.2s, transform 0.12s, box-shadow 0.2s;
        }

        .option-link:hover {
            background-color: rgba(255,255,255,0.12);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            color: #ffffff;
        }

        /* navbar personalizada em azul claro */
        .navbar {
            background-color: #add8e6; /* azul claro */
            position: fixed; /* Fixa a navbar no topo */
            width: 100%;
            top: 0;
            z-index: 10;
        }

        /* garante contraste dos links e marca */
        .navbar .navbar-brand,
        .navbar .nav-link {
            color: #020075 !important; /* texto em azul escuro para contraste */
        }

        /* dropdown com mesma cor e itens legíveis */
        .navbar .dropdown-menu {
            background-color: #add8e6;
            border: none;
        }

        .navbar .dropdown-item {
            color: #020075;
        }

        .navbar .dropdown-item:hover {
            background: rgba(2, 0, 117, 0.08);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">Meu sistema</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Principal</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        Cadastros
                    </a>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="usario-cadastrar.html">Funcionário</a></li>
                        <li><a class="dropdown-item" href="cadastro-clientes.html">Cliente</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="cadastro-ordemservico.html">Ordem de Serviço</a></li>
                    </ul>
                </li>

            </ul>

            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-outline-success">Search</button>
            </form>

        </div>
    </div>
</nav>
 
 <div class="welcome-container">
     <img src="Praia.png"
          class="welcome-img"
          alt="Imagem de Praia">
 
     <div class="welcome-overlay"></div>
 
     <h1 class="welcome-title">Seja bem-vindo!</h1>
 
     <div class="options-container">
       <a href="clientes-lista.html" class="option-link">LISTAGEM DE CLIENTES</a>
       <a href="usuario-lista.html" class="option-link">LISTAGEM DE FUNCIONÁRIOS</a>
       <a href="servicos-lista.html" class="option-link">SERVIÇOS DISPONÍVEIS</a>
     </div>
     </div>

 </body>
 </html>
