<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Ordem de Serviço</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos para ações do formulário */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: .75rem;
            margin-top: 1rem;
            align-items: center;
        }

        .btn-custom-save {
            padding: .55rem 1.25rem;
            border-radius: .5rem;
            box-shadow: 0 6px 18px rgba(11,61,145,0.12);
            font-weight: 600;
        }

        .btn-custom-cancel {
            padding: .5rem 1.1rem;
            border-radius: .5rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3>Cadastro de Ordem de Serviço</h3>
    <hr>

    <form class="card shadow p-4">
        <div class="mb-3">
            <label class="form-label">Nome do Serviço</label>
            <input type="text" class="form-control" placeholder="Digite o nome">
        </div>

        <div class="mb-3">
            <label class="form-label">Preço</label>
            <input type="number" class="form-control" placeholder="0.00">
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea class="form-control" rows="3"></textarea>
        </div>

        <div class="form-actions">
            <a href="ordemservico_lista.html" class="btn btn-outline-secondary btn-lg btn-custom-cancel">Cancelar</a>
            <button type="submit" class="btn btn-success btn-lg btn-custom-save">Salvar</button>
        </div>
    </form>
</div>

</body>
</html>
