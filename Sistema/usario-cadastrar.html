<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Funcionário</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f1f1f1; /* Cinza claro */
    }

    .card {
      border: none;
    }

    .card-header {
      background-color: #0d6efd; /* Azul padrão Bootstrap */
      color: white;
    }

    .btn-primary {
      background-color: #0d6efd; /* Azul */
      border-color: #0d6efd;
    }

    .btn-primary:hover {
      background-color: #0b5ed7; /* Azul mais escuro */
      border-color: #0b5ed7;
    }

    .btn-secondary {
      background-color: #6c757d; /* Cinza */
      border-color: #6c757d;
    }

    .btn-secondary:hover {
      background-color: #5a6268; /* Cinza mais escuro */
      border-color: #545b62;
    }

    .form-label {
      color: #6c757d; /* Cinza */
    }

    .form-control, .form-select {
      border-color: #ced4da;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-header">
        <h4 class="mb-0">Cadastro de Funcionário</h4>
      </div>
      <div class="card-body">
        <form>
          <!-- Nome -->
          <div class="mb-3">
            <label for="nomeFuncionario" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nomeFuncionario" placeholder="Digite o nome completo">
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="emailFuncionario" class="form-label">Email</label>
            <input type="email" class="form-control" id="emailFuncionario" placeholder="Digite o email">
          </div>

          <!-- Senha -->
          <div class="mb-3">
            <label for="senhaFuncionario" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senhaFuncionario" placeholder="Digite a senha">
          </div>

          <!-- Tipo de usuário -->
          <div class="mb-3">
            <label for="tipoFuncionario" class="form-label">Tipo de Funcionário</label>
            <select class="form-select" id="tipoFuncionario">
              <option selected disabled>Selecione o tipo</option>
              <option value="admin">Admin</option>
              <option value="tecnico">Técnico</option>
              <option value="vendedor">Vendedor</option>
              <option value="recepcao">Recepção</option>
            </select>
          </div>

          <!-- Botões -->
          <div class="d-flex justify-content-between">
            <button type="reset" class="btn btn-secondary">Limpar</button>
            <div>
              <button type="button" class="btn btn-primary">Editar Funcionário</button>
              <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
